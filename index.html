<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Power Platform | Plataforma Educativa y Manual de Aprendizaje</title>
  <meta name="description" content="Plataforma educativa moderna e interactiva para dominar Microsoft Power Platform: Power Apps, Power Automate, SharePoint y Microsoft Lists con ejercicios prácticos, fórmulas y laboratorios.">
  
  <!-- Modern Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-header">
    <div class="brand-wrapper">
      <button id="mobile-menu-toggle" class="btn btn-icon-only mobile-menu-toggle" aria-label="Abrir menú de navegación" title="Abrir menú">☰</button>
      <div class="brand-icon-box">⚡</div>
      <div class="brand-title">
        <span class="brand-title-main">Power Platform Master</span>
        <span class="brand-title-sub">Guía Práctica</span>
      </div>
    </div>

    <div class="header-center">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="global-search-input" 
          class="search-bar-input" 
          placeholder="Buscar fórmulas, conceptos, errores o lecciones..."
          autocomplete="off"
        >
        <span class="search-shortcut">Ctrl+K</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="mobile-search-btn" class="btn btn-icon-only mobile-search-btn" title="Buscar">🔍</button>
      <div class="badge-tag tag-gray header-timer-tag" style="font-family: var(--font-mono); font-size: 0.8rem;">
        ⏱️ <span id="header-study-timer">0m 00s</span>
      </div>
      <button id="theme-toggle-btn" class="btn btn-icon-only" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- App Core Layout -->
  <div id="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="main-sidebar" id="main-sidebar">
      <div class="sidebar-section-title">Navegación General</div>
      <a href="#/dashboard" class="nav-item active">
        <span class="nav-icon">📊</span>
        <span>Panel de Inicio</span>
      </a>
      <a href="#/flashcards" class="nav-item">
        <span class="nav-icon">🎴</span>
        <span>Tarjetas de Estudio</span>
      </a>
      <a href="#/quiz" class="nav-item">
        <span class="nav-icon">📝</span>
        <span>Cuestionario Global</span>
      </a>
      <a href="#/checklist" class="nav-item">
        <span class="nav-icon">🎯</span>
        <span>Plan de Acción</span>
      </a>

      <div class="sidebar-section-title" style="margin-top: 1rem;">Capítulos del Manual (15)</div>
      <div id="sidebar-modules-list">
        <!-- Dynamically injected modules from content.js -->
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <div class="content-container" id="main-content-area">
        <!-- Main dynamic view content rendered here -->
      </div>
    </main>

  </div>

  <!-- Search Modal Overlay -->
  <div class="modal-overlay" id="search-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-weight: 700; font-size: 1.15rem;">🔍 Resultados de Búsqueda</h3>
        <button class="modal-close-btn" onclick="window.app.closeSearchModal()">✕</button>
      </div>
      <div class="search-results-list" id="search-results-container">
        <!-- Results injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/content.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
